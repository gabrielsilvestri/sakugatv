<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SakugaTV</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,500..900&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  :root {
    /* sumi (ink), washi (paper) and traditional Japanese colors (nippon no dentou shoku) */
    --ink: #0E0D12;
    --panel: #16141B;
    --raise: #1F1C25;
    --line: #2E2934;
    --text: #F3EEE6;
    --muted: #ABA2A8;
    --shu: #F0503A;             /* 朱 shu: torii-gate red, the brand color */
    --shu-dim: #F0503A2E;
    --yamabuki: #F8B500;        /* 山吹 */
    --wakatake: #68BE8D;        /* 若竹 */
    --ayame: #A88BE8;           /* 菖蒲 */
    --asagi: #2FB8C4;           /* 浅葱 */
    --sakura: #F5A3B8;          /* 桜 */
    --beni: #E83E6C;            /* 紅 */
    --sora: #6CB4EE;            /* 空 */
    --wakakusa: #C3D825;        /* 若草 */
    --daidai: #F39800;          /* 橙 */
    --nezumi: #A3A3A8;          /* 鼠 */
    --jp: 'Dela Gothic One', var(--display);
    --jp-ui: 'Yu Gothic UI', 'Yu Gothic', 'Meiryo', 'Hiragino Sans', sans-serif;   /* legible small kanji */
    --display: 'Anybody', system-ui, sans-serif;
    --body: 'Geist', system-ui, sans-serif;
    --mono: 'Geist Mono', ui-monospace, monospace;
    --bar: 2.75rem;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--ink); color: var(--text); overflow: hidden;
    font: 400 0.9375rem/1.5 var(--body); -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--shu); outline-offset: 2px; border-radius: 6px; }
  [hidden] { display: none !important; }

  /* ---------- top bar ---------- */
  .bar {
    height: var(--bar); display: flex; align-items: center; gap: 1rem;
    padding-left: 0.875rem; border-bottom: 1px solid var(--line); background: var(--ink); user-select: none;
  }
  .brand { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; margin: 0 0.5rem 0 0; font-size: inherit; }
  .brand svg { width: 1.375rem; height: 1.375rem; display: block; }
  .wordmark { font: 800 1.0625rem/1 var(--display); color: var(--text); font-stretch: 135%; letter-spacing: -0.03em; }
  .wordmark b {
    display: inline-block; font: 700 0.625rem/1 var(--jp-ui); letter-spacing: 0.04em; color: #fff; background: #C8321F;
    border-radius: 3px; padding: 0.22rem 0.28rem 0.18rem; margin-left: 0.35rem; vertical-align: 0.12rem; transform: rotate(-4deg);
    box-shadow: inset 0 0 0 1.5px #ffffff40;
  }
  .drag { flex: 1; align-self: stretch; display: flex; align-items: stretch; justify-content: flex-start; min-width: 0; }
  .finder {
    display: flex; align-items: center; gap: 0.6rem; width: min(30rem, 100%); align-self: stretch;
    background: none; border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-radius: 0;
    padding: 0 0.875rem; color: var(--muted); font-size: 0.8125rem; text-align: left; transition: background .15s, color .15s;
  }
  .finder:hover { background: var(--panel); color: var(--text); }
  .finder:hover svg { color: var(--shu); }
  .finder svg { width: 0.875rem; height: 0.875rem; flex-shrink: 0; }
  .finder span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .finder kbd { font: 500 0.6875rem var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0.05rem 0.35rem; }
  .winbtns { display: flex; align-self: stretch; }
  .langbtn { align-self: stretch; margin-left: auto; display: flex; align-items: center; gap: 0.35rem; padding: 0 0.875rem; background: none; border: 0; border-left: 1px solid var(--line); font: 600 0.75rem var(--mono); color: var(--muted); }
  .langbtn span { padding: 0.15rem 0.3rem; border-radius: 4px; }
  .langbtn span.on { color: var(--ink); background: var(--text); }
  .langbtn:hover { color: var(--text); }
  .winbtn { width: 2.875rem; background: none; border: 0; color: var(--muted); display: grid; place-items: center; }
  .winbtn svg { width: 0.75rem; height: 0.75rem; }
  .winbtn:hover { background: var(--raise); color: var(--text); }
  .winbtn.close:hover { background: #C42B1C; color: #fff; }
  .winbtn[aria-pressed="true"] { color: var(--shu); }
  body:not(.app-mode) .app-only { display: none !important; }

  /* ---------- layout ---------- */
  .main { height: calc(100vh - var(--bar)); display: grid; grid-template-columns: minmax(0, 1fr) 25rem; }
  .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 1rem 1.25rem; gap: 0.75rem; position: relative; }
  .screen { position: relative; flex: 1; min-height: 0; background: #000; border-radius: 12px; overflow: hidden; }
  .screen video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 2rem; color: var(--muted); }
  .overlay .kanji { font: 400 7rem/1 var(--jp); color: transparent; -webkit-text-stroke: 1.5px var(--shu); opacity: .5; margin-bottom: 1rem; }
  .overlay p { max-width: 42ch; margin: 0 auto; text-wrap: pretty; }
  .sound-btn { position: absolute; top: 0.875rem; right: 0.875rem; background: #000000b3; border: 1px solid var(--line); border-radius: 999px; padding: 0.4rem 0.9rem; font-size: 0.8125rem; z-index: 2; }

  .hud { display: flex; flex-direction: column; gap: 0.625rem; }
  /* timesheet: every tick is one frame (koma) at 24 fps */
  .sheet { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 1rem; }
  .sheet canvas { width: 100%; height: 32px; display: block; cursor: pointer; }
  .koma { font: 500 0.75rem/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .koma b { color: var(--text); font-weight: 600; }

  .transport { display: grid; grid-template-columns: minmax(0, 1.5fr) auto minmax(0, 1fr); align-items: center; gap: 1rem; }
  .tuner { display: flex; align-items: center; gap: 0.375rem; min-width: 0; }
  .chbtns { display: flex; flex-direction: column; gap: 2px; }
  .chbtns button { width: 1.75rem; height: 1.5rem; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; display: grid; place-items: center; color: var(--muted); }
  .chbtns button:hover { color: var(--text); border-color: var(--muted); }
  .chbtns svg { width: 0.7rem; height: 0.7rem; }
  .chpill {
    display: flex; align-items: center; gap: 0.6rem; min-width: 0; height: 3.125rem; padding: 0 0.875rem 0 0.75rem;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; text-align: left;
  }
  .chpill:hover { border-color: var(--muted); }
  .chpill .num { font: 600 0.75rem var(--mono); color: var(--c, var(--shu)); flex-shrink: 0; }
  .chpill { box-shadow: inset 3px 0 0 var(--c, var(--shu)); }
  .chpill .chname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chpill svg { width: 0.8rem; height: 0.8rem; color: var(--muted); flex-shrink: 0; }
  .order {
    display: flex; align-items: center; gap: 0.4rem; height: 3.125rem; padding: 0 0.75rem; flex-shrink: 0; order: 3;
    background: none; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); font-size: 0.8125rem; font-weight: 600;
  }
  .order:hover { color: var(--text); border-color: var(--muted); }
  .order svg { width: 1rem; height: 1rem; }
  .order.rank { color: var(--yamabuki); border-color: var(--yamabuki); background: color-mix(in srgb, var(--yamabuki) 14%, transparent); }
  body.mini .order { background: #00000080; }
  .center { display: flex; gap: 0.5rem; align-items: center; }
  .right { display: flex; gap: 0.375rem; justify-content: flex-end; }
  .ctl {
    display: inline-grid; place-items: center; width: 2.5rem; height: 2.5rem; flex-shrink: 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--text);
    transition: border-color .15s, background .15s;
  }
  .ctl:hover { border-color: var(--muted); }
  .ctl svg { width: 1.0625rem; height: 1.0625rem; }
  .ctl.big { width: 3.25rem; height: 3.25rem; border-radius: 50%; background: var(--text); color: var(--ink); border-color: var(--text); }
  .ctl.big:hover { background: #fff; }
  .ctl.big svg { width: 1.25rem; height: 1.25rem; }
  .ctl[aria-pressed="true"] { background: var(--shu-dim); border-color: var(--shu); color: var(--shu); }
  .ctl.fav[aria-pressed="true"] svg path { fill: currentColor; }

  /* ---------- right panel ---------- */
  .side { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; gap: 0.25rem; padding: 0.625rem 0.75rem 0; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .tabs button { background: none; border: 0; padding: 0.55rem 0.75rem 0.7rem; color: var(--muted); font-weight: 600; font-size: 0.875rem; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button:hover { color: var(--text); }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--shu); }
  .tabs .count { font: 500 0.75rem var(--mono); color: var(--muted); margin-left: 0.3rem; }
  .pane { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }

  .now { padding: 1.125rem 1.25rem 1.5rem; display: grid; gap: 1.25rem; align-content: start; }
  .eyebrow { margin: 0 0 0.375rem; font: 500 0.6875rem/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--c, var(--shu)); }
  .anime { margin: 0; font: 800 1.625rem/1.08 var(--display); font-stretch: 112%; letter-spacing: -0.02em; text-wrap: balance; }
  .credits { margin: 0.5rem 0 0; color: var(--muted); font-size: 0.875rem; text-wrap: pretty; }
  .credits a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line); }
  .credits a:hover { border-color: var(--shu); }
  .section-h { margin: 0 0 0.625rem; font: 600 0.6875rem/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

  .profs { display: grid; gap: 0.5rem; }
  .prof { border: 1px solid var(--line); border-radius: 12px; background: var(--ink); overflow: hidden; }
  .prof summary { list-style: none; cursor: pointer; display: flex; gap: 0.75rem; align-items: center; padding: 0.75rem 0.875rem; }
  .prof summary::-webkit-details-marker { display: none; }
  .prof .avatar {
    width: 2.5rem; height: 2.5rem; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
    background: color-mix(in srgb, var(--asagi) 18%, transparent); color: var(--asagi); font: 800 0.875rem var(--display); font-stretch: 120%;
  }
  .prof .who { flex: 1; min-width: 0; }
  .prof h3 { margin: 0; font-size: 0.9375rem; font-weight: 650; display: flex; gap: 0.4rem; align-items: center; }
  .prof .sub { margin: 0.1rem 0 0; font: 0.75rem/1.4 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prof .chev { width: 0.9rem; height: 0.9rem; color: var(--muted); transition: transform .2s var(--ease); flex-shrink: 0; }
  .prof[open] .chev { transform: rotate(180deg); }
  .prof .body { padding: 0 0.875rem 0.875rem; display: grid; gap: 0.75rem; font-size: 0.875rem; }
  .prof .body p { margin: 0; max-width: 60ch; text-wrap: pretty; }
  .prof .roles { color: var(--muted); font-size: 0.8125rem; }
  .works { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.3rem; }
  .works li { display: grid; grid-template-columns: 2.75rem 1fr; gap: 0.5rem; font-size: 0.8125rem; }
  .works .y { font: 0.75rem/1.6 var(--mono); color: var(--muted); }
  .works em { font-style: normal; color: var(--muted); }
  .trivia { border-left: 2px solid var(--asagi); padding-left: 0.625rem; color: var(--muted); }
  .prof .go { justify-self: start; }

  .taglist { margin: 0; display: grid; gap: 0.75rem; }
  .taglist dt { font: 600 0.6875rem/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
  .taglist dd { margin: 0; display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .tagpair { display: inline-flex; max-width: 100%; }
  .tag {
    border: 1px solid var(--line); border-right: 0; background: var(--ink); border-radius: 999px 0 0 999px; padding: 0.22rem 0.55rem 0.22rem 0.65rem;
    font-size: 0.8125rem; max-width: 100%; text-align: left;
  }
  .tag { color: var(--k, var(--text)); }
  .tag:hover, .tag:focus-visible { border-color: var(--k, var(--shu)); background: color-mix(in srgb, var(--k, var(--shu)) 14%, var(--ink)); }
  .taglist dt { color: var(--k, var(--muted)); }
  .hide { border: 1px solid var(--line); background: var(--ink); color: var(--muted); border-radius: 0 999px 999px 0; padding: 0 0.5rem 0 0.4rem; display: grid; place-items: center; }
  .hide svg { width: 0.85rem; height: 0.85rem; }
  .hide:hover, .hide:focus-visible { color: var(--text); border-color: var(--muted); background: var(--raise); }
  .meta { margin: 0; font: 0.75rem/1.6 var(--mono); color: var(--muted); }

  .queue { list-style: none; margin: 0; padding: 0.625rem; }
  .queue li button { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: 0.75rem; align-items: center; width: 100%; background: none; border: 0; padding: 0.375rem; border-radius: 10px; text-align: left; }
  .queue li button:hover { background: var(--raise); }
  .queue img { width: 6.5rem; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; background: var(--ink); display: block; }
  .queue .q1 { display: block; font-size: 0.875rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .queue .q2 { display: block; font-size: 0.75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .btn { border-radius: 8px; padding: 0.5rem 0.875rem; border: 1px solid var(--line); background: var(--raise); font-size: 0.875rem; white-space: nowrap; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--shu); border-color: var(--shu); color: var(--ink); font-weight: 650; }
  .btn.primary:hover { background: #FF6A54; }
  .btn.ghost { background: none; }
  .badge { flex-shrink: 0; font: 600 0.5625rem/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; padding: 0.2rem 0.35rem; border-radius: 4px; border: 1px solid currentColor; color: var(--muted); }
  .badge.extra { color: #fff; background: #C2244F; border-color: #C2244F; font-size: 0.625rem; }

  /* ---------- channel guide ---------- */
  .guide {
    position: fixed; inset: var(--bar) 0 0 0; z-index: 20; background: #0E0D12f7; backdrop-filter: blur(14px);
    display: grid; grid-template-columns: 15rem minmax(0, 1fr);
    animation: guideIn .22s var(--ease);
  }
  @keyframes guideIn { from { opacity: 0; transform: translateY(-6px); } }
  .cats { border-right: 1px solid var(--line); padding: 1.25rem 0.75rem; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .cats h2 { margin: 0 0.625rem 0.875rem; font: 800 1.25rem/1 var(--display); font-stretch: 125%; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 0.5rem; }
  .cats h2 small { font: 700 0.75rem var(--jp-ui); color: var(--shu); letter-spacing: 0.05em; }
  .cat { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; background: none; border: 0; border-radius: 8px; padding: 0.5rem 0.625rem; text-align: left; color: var(--muted); font-weight: 500; }
  .cat:hover { background: var(--raise); color: var(--text); }
  .cat .nm { display: flex; align-items: center; gap: 0.55rem; }
  .cat .dot { width: 0.5rem; height: 0.5rem; border-radius: 2px; background: var(--c); flex-shrink: 0; transform: rotate(45deg); }
  .cat .kj { font: 600 0.6875rem var(--jp-ui); color: var(--c); opacity: .9; letter-spacing: 0.04em; }
  .cat[aria-current="true"] { background: color-mix(in srgb, var(--c) 12%, var(--raise)); color: var(--text); box-shadow: inset 2px 0 0 var(--c); }
  .cat .n { font: 0.75rem var(--mono); color: var(--muted); }
  .cats hr { border: 0; border-top: 1px solid var(--line); margin: 0.5rem 0.625rem; }
  .gmain { overflow-y: auto; overscroll-behavior: contain; padding: 0 1.75rem 3rem; }
  .gsearch { position: sticky; top: 0; z-index: 2; margin: 0 -1.75rem 1rem; padding: 1.25rem 1.75rem 1rem; background: linear-gradient(#0E0D12 78%, #0E0D1200); display: flex; gap: 0.75rem; }
  .gsearch label { flex: 1; display: flex; align-items: center; gap: 0.6rem; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0 0.875rem; }
  .gsearch label:focus-within { border-color: var(--shu); }
  .gsearch svg { width: 1rem; height: 1rem; color: var(--muted); flex-shrink: 0; }
  .gsearch input { flex: 1; min-width: 0; background: none; border: 0; outline: none; padding: 0.7rem 0; font-size: 1rem; }
  .gsearch input::placeholder { color: var(--muted); }
  .ghead { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: 1.125rem; flex-wrap: wrap; }
  .ghead { position: relative; }
  .ghead h3 { margin: 0 0 0 0.25rem; font: 800 2rem/1 var(--display); font-stretch: 120%; letter-spacing: -0.025em; position: relative; }
  .ghead h3 .kjt { font: 400 1.25rem/1 var(--jp); color: var(--c, var(--shu)); margin-left: 0.75rem; vertical-align: 0.3rem; letter-spacing: 0.06em; }
  .ghead > div { position: relative; z-index: 1; }
  .ghead h3 .bar-c { display: inline-block; width: 0.55rem; height: 1.6rem; background: var(--c, var(--shu)); margin-right: 0.6rem; vertical-align: -0.12rem; border-radius: 2px; }
  .ghead p { margin: 0.45rem 0 0; color: var(--muted); font-size: 0.875rem; max-width: 60ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(13.5rem, 1fr)); gap: 0.875rem; }
  .tile { position: relative; border-radius: 12px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); transition: border-color .15s, transform .2s var(--ease); }
  .tile { border-top: 3px solid var(--c, var(--line)); }
  .tile:hover { border-color: var(--c, var(--muted)); transform: translateY(-2px); }
  .tile.on { border-color: var(--c, var(--shu)); box-shadow: 0 0 0 1px var(--c, var(--shu)), 0 8px 24px -10px var(--c, var(--shu)); }
  .tile > button.pick { display: block; width: 100%; background: none; border: 0; padding: 0; text-align: left; }
  .thumb { aspect-ratio: 16/9; background: var(--raise) center/cover no-repeat; position: relative; }
  .thumb::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, #0E0D12d9, #0E0D1200 55%); }
  .thumb .ch { position: absolute; top: 0.5rem; left: 0.55rem; z-index: 1; font: 600 0.6875rem var(--mono); background: var(--ink); border-radius: 4px; padding: 0.15rem 0.35rem; color: var(--c, var(--shu)); }
  .thumb .pc { position: absolute; bottom: 0.5rem; right: 0.55rem; z-index: 1; font: 500 0.6875rem var(--mono); background: #0E0D12d9; border-radius: 4px; padding: 0.15rem 0.35rem; color: var(--text); }
  .thumb .glyph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--c, var(--shu)); z-index: 1; }
  .thumb .glyph svg { width: 2.25rem; height: 2.25rem; }
  .tinfo { padding: 0.625rem 0.75rem 0.75rem; }
  .tname { display: flex; align-items: center; gap: 0.4rem; font-weight: 650; }
  .tname span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tsub { display: block; margin-top: 0.15rem; font-size: 0.75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .edit { position: absolute; top: 0.4rem; right: 0.4rem; z-index: 2; width: 1.875rem; height: 1.875rem; border-radius: 7px; border: 0; background: #0E0D12d9; color: var(--text); display: grid; place-items: center; opacity: 0; }
  .tile:hover .edit, .tile .edit:focus-visible { opacity: 1; }
  .tile .edit svg { width: 0.85rem; height: 0.85rem; }
  .tile.add { border-style: dashed; background: none; }
  .tile.add .thumb { background: none; }
  .tile.add .thumb::after { display: none; }
  .rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.25rem; max-width: 44rem; }
  .rows li { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.55rem 0.75rem; border-radius: 8px; background: var(--panel); }
  .rows li > span, .rows .rowpick span { font: 0.8125rem var(--mono); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rows .rowpick { flex: 1; text-align: left; background: none; border: 0; padding: 0; min-width: 0; display: flex; }

    e.preventDefault();
    const v = $('edTag').value.trim();
    if (sugIndex >= 0 && !$('suggest').hidden) addTag((v.startsWith('-') ? '-' : '') + sugItems[sugIndex].name);
    else if (v) addTag(v);
  }
});
$('edTag').addEventListener('blur', () => setTimeout(() => { $('suggest').hidden = true; }, 100));
$('edForm').addEventListener('submit', (e) => {
  e.preventDefault();
  if ($('edTag').value.trim()) addTag($('edTag').value);
  const data = { name: $('edName').value.trim(), include: draft.include, exclude: draft.exclude, minScore: Number($('edScore').value) };
  let id;
  if (editing) { Object.assign(editing, data); id = editing.id; }
  else { id = 'c' + Date.now().toString(36); state.channels.push({ id, ...data }); }
  save(); closeEditor(); numberChannels();
  tune(id); closeGuide();
  toast(t('chSaved', { n: data.name }));
});
$('edCancel').onclick = closeEditor;
$('edDelete').onclick = () => {
  if (!editing) return;
  const gone = editing;
  state.channels = state.channels.filter((c) => c !== gone);
  save(); closeEditor(); numberChannels();
  if (channel && channel.id === gone.id) tune('top');
  if (!$('guide').hidden) renderGuide();
  toastAction(t('chDeleted', { n: gone.name }), t('undo'), () => { state.channels.push(gone); save(); numberChannels(); if (!$('guide').hidden) renderGuide(); });
};

// ---------- window, player-only mode and full screen ----------
// in the native app (window.ipc exists) the window is frameless and the app moves it
const inApp = !!window.ipc;
if (inApp) document.body.classList.add('app-mode');
const win = (msg) => inApp && window.ipc.postMessage(msg);
for (const b of document.querySelectorAll('[data-win]')) b.onclick = () => win(b.dataset.win);
$('bar').addEventListener('mousedown', (e) => { if (!e.target.closest('button') && e.button === 0 && e.detail === 1) win('drag'); });
$('bar').addEventListener('dblclick', (e) => { if (!e.target.closest('button')) win('max'); });

let onTop = ls.get('sakugatv.top', '0') === '1';
function setTop(on) {
  onTop = on; ls.set('sakugatv.top', on ? '1' : '0');
  win(on ? 'top:on' : 'top:off');
  for (const b of document.querySelectorAll('.pin')) { b.setAttribute('aria-pressed', String(on)); b.title = on ? t('pinOn') : t('pin'); }
}
for (const b of document.querySelectorAll('.pin')) b.onclick = () => { setTop(!onTop); toast(onTop ? t('pinToast') : t('pinOff')); };
if (inApp) setTop(onTop);

let fullscreen = false;
function setMini(on) {
  document.body.classList.toggle('mini', on);
  $('miniBtn').setAttribute('aria-pressed', String(on));
  if (!on && fullscreen) setTheater(false);
  if (on) pokeHud(); else document.body.classList.remove('hud-on');
  requestAnimationFrame(drawSheet);
}
function setTheater(on) {
  fullscreen = on;
  if (on) setMini(true);
  if (inApp) win(on ? 'fullscreen:on' : 'fullscreen:off');
  else if (on && !document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
  else if (!on && document.fullscreenElement) document.exitFullscreen?.();
  requestAnimationFrame(drawSheet);
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && fullscreen) { fullscreen = false; requestAnimationFrame(drawSheet); } });
$('miniBtn').onclick = () => setMini(!document.body.classList.contains('mini'));
$('miniExit').onclick = () => setMini(false);
$('theaterBtn').onclick = () => setTheater(!fullscreen);
$('screen').addEventListener('dblclick', () => setTheater(!fullscreen));
$('screen').addEventListener('mousedown', (e) => {
  if (document.body.classList.contains('mini') && !fullscreen && e.button === 0 && e.detail === 1 && !e.target.closest('button')) win('drag');
});
// controls show on mouse move and fade on their own: 2 s idle over the video, 4 s idle over them
let hudTimer, overHud = false;
function pokeHud() {
  document.body.classList.add('hud-on');
  clearTimeout(hudTimer);
  hudTimer = setTimeout(() => document.body.classList.remove('hud-on'), overHud ? 4000 : 2000);
}
for (const el of [$('hud'), $('miniTop')]) {
  el.addEventListener('pointerenter', () => { overHud = true; });
  el.addEventListener('pointerleave', () => { overHud = false; });
}
document.addEventListener('pointermove', () => { if (document.body.classList.contains('mini')) pokeHud(); });
// a clicked HUD button doesn't keep focus (focus used to keep the controls on screen)
document.addEventListener('click', (e) => {
  const b = e.target.closest('.hud button, .mini-top button');
  if (b && e.detail > 0 && document.body.classList.contains('mini')) b.blur();
});
document.documentElement.addEventListener('pointerleave', () => {
  if (!document.body.classList.contains('mini')) return;
  overHud = false; clearTimeout(hudTimer);
  hudTimer = setTimeout(() => document.body.classList.remove('hud-on'), 400);
});

// ---------- keyboard ----------
$('prevBtn').onclick = back;
$('nextBtn').onclick = advance;
$('playBtn').onclick = togglePlay;
$('favBtn').onclick = toggleFav;
$('chUp').onclick = () => stepChannel(-1);
$('chDown').onclick = () => stepChannel(1);
function toggleZap() {
  if (channel.id === ZAP_ID) return tune(state.lastPicked || 'top');
  const scope = channel.virtual || channel.temp ? 'Todos' : channel.extra && EXTRA ? EXTRA.name : channel.group || 'Todos';
  tune(ZAP_ID, { scope: ['Destaques', 'Meus canais'].includes(scope) ? 'Todos' : scope });
}
$('zapBtn').onclick = toggleZap;
// the order applies to the open channel and is saved on it; the current clip keeps playing, the queue is rebuilt
function toggleOrder() {
  if (!channel || channel.virtual) return;
  channel.order = channel.order === 'score' ? 'random' : 'score';
  if (!channel.temp) save();
  queue = []; exhausted = false; pages.delete(channel.id); gen++;
  renderNowBar(); fetchMore().then(preloadNext);
  toast(channel.order === 'score' ? t('rankToast') : t('randToast'));
}
$('orderBtn').onclick = toggleOrder;
function showTab(t) {
  $('tabNow').setAttribute('aria-selected', String(t === 'now')); $('tabQ').setAttribute('aria-selected', String(t === 'q'));
  $('paneNow').hidden = t !== 'now'; $('paneQ').hidden = t !== 'q';
}
$('tabNow').onclick = () => showTab('now');
$('tabQ').onclick = () => showTab('q');
document.addEventListener('keydown', (e) => {
  if ($('editor').open) return;
  if (!$('guide').hidden) { if (e.key === 'Escape') { e.preventDefault(); closeGuide(); } return; }
  if (e.target.closest('input, select, textarea')) return;
  if (document.body.classList.contains('mini')) pokeHud();
  const k = e.key.toLowerCase();
  if (k === 'g' || e.key === '/') { e.preventDefault(); openGuide(true); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); advance(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); back(); }
  else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); stepChannel(-1); }
  else if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); stepChannel(1); }
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (k === 'f') toggleFav();
  else if (k === 'z') toggleZap();
  else if (k === 'o') toggleOrder();
  else if (k === 't' || e.key === 'F11') { e.preventDefault(); setTheater(!fullscreen); }
  else if (k === 'p') setMini(!document.body.classList.contains('mini'));
  else if (k === 'm') { userMuted = !active.muted; active.muted = userMuted; toast(userMuted ? t('muted') : t('unmuted')); if (!userMuted) { soundOk = true; $('soundBtn').hidden = true; } }
  else if (e.key === 'Escape') { if (fullscreen) setTheater(false); else if (document.body.classList.contains('mini')) setMini(false); }
});
document.addEventListener('pointerdown', () => { if (!soundOk && current && !userMuted) { soundOk = true; active.muted = false; $('soundBtn').hidden = true; } }, { once: true });

// ---------- start ----------
(async () => {
  const json = (u, d) => fetch(u).then((r) => (r.ok ? r.json() : d)).catch(() => d);
  let list, local, cfg;
  [state, list, local, cfg] = await Promise.all([fetch('/api/state').then((r) => r.json()), json('/animadores.json', []), json('/animadores.local.json', []), json('/api/config', {})]);
  EXTRA = cfg.extraCategory || null;
  // local profiles (not in git) override or extend the public ones
  profiles = Object.fromEntries(list.map((p) => [p.tag, p]));
  for (const p of local) profiles[p.tag] = { ...(profiles[p.tag] || {}), ...p };
  applyStatic();
  seenSet = new Set(state.seen);
  numberChannels();
  tune(state.lastChannel);
})();
</script>
</body>
</html>
